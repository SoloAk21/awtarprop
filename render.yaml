services:
  # 1. Express Backend REST API
  - type: web
    name: awtarprop-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  # 2. Telegram Bot Worker
  - type: worker
    name: awtarprop-bot
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm run build:bot
    startCommand: npm run start:bot
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
